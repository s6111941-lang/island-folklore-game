name: Deploy Godot Web test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q Godot_v4.7.2-stable_export_templates.tpz
          WEB_TEMPLATE="$(find templates -maxdepth 1 -type f -name 'web_nothreads_release*.zip' | head -n 1)"
          test -n "$WEB_TEMPLATE"
          cp templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          cp "$WEB_TEMPLATE" "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
          WEB_DEBUG_TEMPLATE="$(find templates -maxdepth 1 -type f -name 'web_nothreads_debug*.zip' | head -n 1)"
          if [ -n "$WEB_DEBUG_TEMPLATE" ]; then
            cp "$WEB_DEBUG_TEMPLATE" "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_debug.zip"
          fi
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Diagnose Godot Web configuration
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --version
          echo "Installed export templates:"
          find "$HOME/.local/share/godot/export_templates/4.7.2.stable" -maxdepth 1 -type f -printf '%f\n' | sort
          echo "Web export preset:"
          sed -n '1,160p' export_presets.cfg
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --verbose --path . --editor --quit

      - name: Export Web build
        run: |
          mkdir -p build/web
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --verbose --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
